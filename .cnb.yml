# Lunchbox Hub CI 流水线
# 多架构 Android + iOS 构建

.common: &common
  docker:
    image: ghcr.io/cirruslabs/flutter:stable
  stages:
    - flutter --version
    - flutter pub get
    - dart run slang
    - dart run build_runner build --delete-conflicting-outputs

.android: &android
  <<: *common
  stages:
    - flutter --version
    - flutter pub get
    - dart run slang
    - dart run build_runner build --delete-conflicting-outputs
    - flutter build appbundle --release --dart-define-from-file=config/env_prod.json --obfuscate --split-debug-info=build/app/outputs/symbols
    - flutter build apk --release --dart-define-from-file=config/env_prod.json --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols

.ios: &ios
  <<: *common
  stages:
    - flutter --version
    - flutter pub get
    - dart run slang
    - dart run build_runner build --delete-conflicting-outputs
    - flutter build ios --release --no-codesign --dart-define-from-file=config/env_prod.json --obfuscate --split-debug-info=build/ios/symbols

main:
  # 手动触发-全部平台（latest）
  web_trigger:
    - <<: *android
    - <<: *ios
  # 手动触发-仅 Android
  web_trigger_android:
    - <<: *android
  # 手动触发-仅 iOS
  web_trigger_ios:
    - <<: *ios
  # Tag 推送-自动构建全平台
  tag_push:
    - <<: *android
    - <<: *ios

# 兜底分支（无操作）
$:
  web_trigger: []
  tag_push: []
