name: Flutter Build & Release app

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build Android APK'
        required: false
        type: boolean
        default: true
      build_appbundle:
        description: 'Build Android AppBundle (AAB)'
        required: false
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS App'
        required: false
        type: boolean
        default: false
      build_mode:
        description: 'Build Mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  prepare:
    name: Prepare Matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_tasks: ${{ steps.set-matrix.outputs.has_tasks }}
      version: ${{ steps.meta.outputs.version }}
      build_mode: ${{ steps.meta.outputs.build_mode }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.build_mode }}"
            TAG="v$VERSION"
          else
            # tag 推送发版：固定 release，tag 用被推送的 tag
            MODE=release
            TAG="${{ github.ref_name }}"
            [ "${TAG#v}" == "$VERSION" ] || echo "::warning::tag $TAG 与 pubspec 版本 $VERSION 不一致"
          fi
          {
            echo "version=$VERSION"
            echo "build_mode=$MODE"
            echo "tag=$TAG"
          } >> $GITHUB_OUTPUT
      - id: set-matrix
        run: |
          TASKS=()
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.build_apk }}" == "true" ]; then TASKS+=("apk"); fi
            if [ "${{ github.event.inputs.build_appbundle }}" == "true" ]; then TASKS+=("appbundle"); fi
            if [ "${{ github.event.inputs.build_ios }}" == "true" ]; then TASKS+=("ios"); fi
          else
            # tag 发版：只出 APK + AAB
            TASKS=("apk" "appbundle")
          fi
          if [ ${#TASKS[@]} -eq 0 ]; then
            echo "has_tasks=false" >> $GITHUB_OUTPUT
            echo "matrix={\"task\":[]}" >> $GITHUB_OUTPUT
          else
            JSON_TASKS=$(printf '%s\n' "${TASKS[@]}" | jq -R . | jq -s -c .)
            echo "has_tasks=true" >> $GITHUB_OUTPUT
            echo "matrix={\"task\":$JSON_TASKS}" >> $GITHUB_OUTPUT
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.has_tasks == 'true'
    name: Build ${{ matrix.task }}
    runs-on: ${{ matrix.task == 'ios' && 'macos-latest' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        if: matrix.task != 'ios'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 插件已全部是 Swift Package（sentry_flutter 无 podspec），必须移除 CocoaPods 集成
      - name: Drop CocoaPods
        if: matrix.task == 'ios'
        run: |
          cd ios
          if [ -f Podfile ]; then
            pod deintegrate
            rm -f Podfile Podfile.lock
            rm -rf Pods
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Restore Environment Files
        run: |
          echo "${{ secrets.ENV_PROD }}" > .env.prod
          echo "${{ secrets.ENV_DEV }}" > .env.dev

      - name: Build Runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze Build Size (Release only)
        if: needs.prepare.outputs.build_mode == 'release' && matrix.task == 'apk'
        run: |
          flutter build apk --release --analyze-size --target-platform android-arm64
          echo "📊 Build size analysis completed. Check logs above for details."

      - name: Build Task
        run: |
          BUILD_MODE="${{ needs.prepare.outputs.build_mode }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          OUT=build/app/outputs/flutter-apk
          if [ "${{ matrix.task }}" == "apk" ]; then
            if [ "$BUILD_MODE" == "release" ]; then
              # 分 ABI 构建（arm64-v8a / armeabi-v7a），符号单独存放避免被 universal 构建覆盖
              flutter build apk --release \
                --obfuscate \
                --split-debug-info=build/app/outputs/symbols \
                --split-per-abi \
                --target-platform android-arm,android-arm64 \
                --tree-shake-icons
              for file in "$OUT"/app-*-release.apk; do
                [ -f "$file" ] || continue
                # app-armeabi-v7a-release.apk -> armeabi-v7a
                abi=$(basename "$file" | sed 's/app-\(.*\)-release.apk/\1/')
                mv "$file" "$OUT/lunchbox_${VERSION}_${abi}.apk"
              done
              # 通用包
              flutter build apk --release \
                --obfuscate \
                --split-debug-info=build/app/outputs/symbols-universal \
                --tree-shake-icons
              mv $OUT/app-release.apk "$OUT/lunchbox_${VERSION}_universal.apk"
            else
              flutter build apk --$BUILD_MODE
              mv $OUT/app-$BUILD_MODE.apk "$OUT/lunchbox_${VERSION}_debug.apk"
            fi
          elif [ "${{ matrix.task }}" == "appbundle" ]; then
            # 生产构建优化：启用混淆、Tree-shaking
            if [ "$BUILD_MODE" == "release" ]; then
              flutter build appbundle --release \
                --obfuscate \
                --split-debug-info=build/app/outputs/symbols \
                --tree-shake-icons
              mv build/app/outputs/bundle/release/app-release.aab "build/app/outputs/bundle/release/lunchbox_${VERSION}.aab"
            else
              flutter build appbundle --$BUILD_MODE
              mv build/app/outputs/bundle/debug/app-debug.aab "build/app/outputs/bundle/debug/lunchbox_${VERSION}_debug.aab"
            fi
          elif [ "${{ matrix.task }}" == "ios" ]; then
            flutter build ios --release --no-codesign \
              --obfuscate \
              --split-debug-info=build/ios/symbols \
              --tree-shake-icons
            # 无签名只能出 .app，Release 只接受文件，打成 zip
            ROOT="$PWD"
            (cd build/ios/iphoneos && zip -qry "$ROOT/build/lunchbox_${VERSION}_ios-unsigned.zip" ./*.app)
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.task }}-${{ needs.prepare.outputs.build_mode }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/*/*.aab
            build/lunchbox_*_ios-unsigned.zip
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload Debug Symbols (Release only)
        if: needs.prepare.outputs.build_mode == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ matrix.task }}
          path: |
            build/app/outputs/symbols/**
            build/app/outputs/symbols-universal/**
            build/ios/symbols/**
          compression-level: 9
          if-no-files-found: ignore

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.build_mode == 'release'
    name: Create Unified Release
    runs-on: ubuntu-24.04
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "*-*" # Matches all matrix build names (e.g., apk-release, ios-release)

      - name: Pack Symbol Bundles
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          ROOT="$PWD"
          for d in artifacts/symbols-*; do
            [ -d "$d" ] || continue
            task=${d##*/symbols-}
            # 进入目录压缩，避免包内出现 artifacts/ 前缀
            (cd "$d" && zip -qr "$ROOT/artifacts/lunchbox_${VERSION}_symbols-$task.zip" .)
          done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Lunchbox ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/**/*.apk
            artifacts/**/*.aab
            artifacts/**/*.zip
            artifacts/*.zip
            artifacts/**/*.ipa
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
