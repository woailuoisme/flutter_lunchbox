# Lefthook configuration for Flutter/Dart and Shell/Markdown linting.
# Refer to https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md

pre-commit:
  parallel: true
  jobs:
    - name: dart-format
      glob: "lib/**/*.dart"
      exclude:
        - "lib/**/*.g.dart"
        - "lib/**/*.freezed.dart"
      run: dart format --set-exit-if-changed {staged_files}

    - name: dart-analyze
      glob: "lib/**/*.dart"
      run: flutter analyze

    - name: shell-check
      glob: "scripts/*.sh"
      run: shellcheck {staged_files}

    - name: shell-format-check
      glob: "scripts/*.sh"
      run: shfmt -d -i 4 -ci -sr {staged_files}

