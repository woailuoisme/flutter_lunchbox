name: lunchbox
description: "基于 Flutter 的移动应用"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.8

# 核心依赖
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # 状态管理
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # 路由与网络
  go_router: ^18.1.0
  dio: ^5.11.1
  dio_http2_adapter: ^2.9.0
  retrofit: ^4.10.0
  connectivity_plus: ^7.3.1
  # 存储
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1

  # 基础 UI
  flutter_screenutil: ^5.9.3
  flex_color_scheme: ^9.0.0
  material_ui: ^1.7.0
  material_symbols_icons: ^4.2960.0
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.0
  animations: ^3.0.0

  # 扩展 UI 组件
  toastification: ^3.2.0
  cached_network_image: ^4.0.4
  infinite_scroll_pagination: ^5.1.1
  custom_refresh_indicator: ^4.0.2
  flutter_spinkit: ^5.2.2
  introduction_screen: ^5.0.1
  flutter_slidable: ^4.0.3
  toggle_switch: ^2.3.0
  expandable: ^5.0.1
  carousel_slider: ^5.1.2
  smooth_page_indicator: ^3.0.0
  skeletonizer: ^3.0.0
  webview_flutter: ^4.14.1
  qr_flutter: ^4.1.0
  convex_bottom_bar: ^3.2.0
  google_nav_bar: ^5.0.7
  alphabet_list_view: ^1.2.1
  timelines_plus: ^2.0.1
  page_transition: ^2.2.2
  upgrader: ^13.7.0
  flutter_rating_bar: ^4.0.1

  # 地图与定位
  flutter_map: ^8.3.2
  geolocator: ^14.1.1
  latlong2: ^0.10.1

  # 系统与设备功能
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  permission_handler: ^13.0.2
  path_provider: ^2.1.6
  image_picker: ^1.2.4
  url_launcher: ^6.3.3

  # 业务功能
  flutter_form_builder: ^11.0.0
  form_builder_validators: ^11.3.0
  google_sign_in: ^7.2.0
  flutter_stripe: ^14.2.0
  slang_flutter: ^4.19.0
  # 5.x/13.x 起支持 built-in Kotlin，不再对 Android 工程应用 KGP
  firebase_core: ^5.0.0
  firebase_analytics: ^13.0.0
  sentry_flutter: ^10.1.0
  sentry_dio: ^10.1.0

  # 逻辑工具与日志
  intl: ^0.20.3
  lpinyin: ^2.0.3
  talker_flutter: ^5.1.20
  talker_dio_logger: ^5.1.20
  path: ^1.9.1
  freezed_annotation: ^3.1.0
  envied: ^1.3.10
  flutter_native_splash: ^2.4.8

  cupertino_ui: ^1.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod: ^3.4.3

  # 环境配置生成
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.9

  # 代码生成器
  # 2.17+ 要求 build 5.x，而 retrofit_generator/json_serializable 仍锁 build ^4
  build_runner: ">=2.16.2 <2.17.0"
  riverpod_generator: ^4.0.9
  retrofit_generator: ^10.2.12
  freezed: ^4.0.3
  json_serializable: ^6.14.1
  drift_dev: ^2.35.1
  envied_generator: ^1.3.10
  go_router_builder: ^4.5.0
  # 国际化生成
  slang: ^4.19.2
  # 开发工具
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  # retrofit_generator / json_serializable 只支持 build 4.x
  build: 4.0.9

flutter:
  uses-material-design: true

  # 资源配置
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/html/
